<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Divyasree Whispers of the Wind Voice Agent">
  <defs>
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172820" />
      <stop offset="100%" stop-color="#0d1813" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d692" />
      <stop offset="55%" stop-color="#c39842" />
      <stop offset="100%" stop-color="#8b651f" />
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d7a56" />
      <stop offset="100%" stop-color="#163f2c" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="636" height="156" rx="16" fill="url(#bgPlate)" stroke="url(#goldGrad)" stroke-width="2" />
  <rect x="10" y="10" width="620" height="140" rx="11" fill="none" stroke="#c39842" stroke-opacity="0.25" stroke-width="1" />

  <!-- Circular architectural valley emblem -->
  <g transform="translate(86, 80)">
    <circle cx="0" cy="0" r="46" fill="#0e1b15" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="39" fill="none" stroke="#c39842" stroke-opacity="0.35" stroke-width="1" />
    <!-- Nandi Hills layered valley silhouette -->
    <path d="M-34 14 Q-16 -12 2 8 Q18 -8 34 14 L34 22 A36 36 0 0 1 -34 22 Z" fill="url(#hillGrad)" opacity="0.9" />
    <!-- Stylized wind ribbon -->
    <path d="M-26 -8 C-10 -20, 8 -20, 22 -10" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M-20 0 C-6 -9, 10 -9, 26 -2" fill="none" stroke="#e8cd87" stroke-width="1.4" stroke-linecap="round" opacity="0.75" />
    <!-- W monogram -->
    <text x="0" y="25" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="url(#goldGrad)" letter-spacing="1">W</text>
  </g>

  <!-- Typography -->
  <text x="156" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.8" font-weight="700" fill="#d3ae60" letter-spacing="2">DIVYASREE DEVELOPERS  |  NANDI VALLEY, NORTH BENGALURU</text>
  <text x="156" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#f5f1e6" letter-spacing="0.4">Whispers of the Wind</text>
  <line x1="156" y1="101" x2="600" y2="101" stroke="url(#goldGrad)" stroke-opacity="0.45" stroke-width="1" />
  <text x="156" y="124" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#9bc2ac" letter-spacing="1.2">OUTBOUND AI VOICE AGENT (DHRUV)  |  GEMINI 3.8 LIVE</text>
</svg>
